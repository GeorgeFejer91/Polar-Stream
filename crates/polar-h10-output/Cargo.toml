[package]
name = "polar-h10-output"
description = "Independent LSL, OSC, and bounded CSV output routing for Polar H10 signals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["liblsl-backend"]
liblsl-backend = ["dep:libloading"]
rusty-lsl-backend = ["dep:rusty-lsl"]

[dependencies]
libloading = { workspace = true, optional = true }
polar-h10-core = { path = "../polar-h10-core" }
polar-stream-time = { path = "../polar-stream-time" }
polar-h10-math = { path = "../polar-h10-math" }
polar-h10-metrics = { path = "../polar-h10-metrics" }
rusty-lsl = { git = "https://github.com/MesmerPrism/rusty-lsl", rev = "8b6b2a6cd0c0e5147b7e1cc076a116ef226cddbd", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
vernier-gdx-core = { path = "../vernier-gdx-core" }

[[example]]
name = "verify_rusty_lsl"
required-features = ["rusty-lsl-backend"]
