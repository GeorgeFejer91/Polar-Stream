; Polar Stream's packaged LabRecorder profile.
;
; LabRecorder still presents every discoverable LSL stream and lets the user
; choose the subset to record. Storage and file naming remain user-controlled
; in the LabRecorder window.
;
; The upstream remote-control socket accepts unauthenticated local commands.
; Polar Stream does not use it, so the bundled launcher keeps it off by
; default. Users who deliberately need remote control can load another config
; from LabRecorder.
RCSEnabled=0
RCSPort=22345
