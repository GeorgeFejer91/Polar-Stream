[package]
name = "polar-stream"
description = "Low-latency Polar H10 bridge for LSL, OSC, local CSV, and live visualization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["liblsl-backend"]
liblsl-backend = ["polar-h10-output/liblsl-backend"]
rusty-lsl-backend = ["polar-h10-output/rusty-lsl-backend"]

[lib]
name = "polar_stream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "polar-stream"
path = "src/main.rs"

[[example]]
name = "verify_rusty_lsl_h10"
required-features = ["rusty-lsl-backend"]

[dependencies]
polar-h10-core = { path = "../../crates/polar-h10-core" }
polar-h10-input = { path = "../../crates/polar-h10-input" }
polar-h10-metrics = { path = "../../crates/polar-h10-metrics" }
polar-h10-output = { path = "../../crates/polar-h10-output", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
