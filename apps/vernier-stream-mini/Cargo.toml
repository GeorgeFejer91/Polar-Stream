[package]
name = "vernier-stream-mini"
description = "Standalone low-latency Vernier Go Direct to LSL mini node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["liblsl-backend"]
liblsl-backend = ["stream-mini-runtime/liblsl-backend"]
rusty-lsl-backend = ["stream-mini-runtime/rusty-lsl-backend"]

[lib]
name = "vernier_stream_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vernier-stream-mini"
path = "src/main.rs"

[dependencies]
serde.workspace = true
stream-mini-runtime = { path = "../../crates/stream-mini-runtime", default-features = false }
tauri = { version = "2.11", features = [] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Radios", "Foundation"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
