name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-08-13
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check native application
        run: cargo check -p polar-stream --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend:
    name: Frontend renderer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-previews.txt
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r requirements-previews.txt
      - run: python scripts/generate_metric_previews.py --check
      - run: npx playwright install --with-deps chromium
      - run: node --check apps/polar-stream/ui/runtime-api.js
      - run: node --check apps/polar-stream/ui/preferences.js
      - run: node --check apps/polar-stream/ui/metric-previews.js
      - run: node --check apps/polar-stream/ui/app.js
      - run: node --check download/downloads.js
      - run: npm run validate:interface
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: interface-renderer
          path: artifacts/interface-renderer/
