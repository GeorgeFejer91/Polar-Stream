name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check native application
        run: cargo check -p polar-stream --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend:
    name: Frontend renderer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check apps/polar-stream/ui/preferences.js
      - run: node --check apps/polar-stream/ui/app.js
      - run: node --check download/downloads.js
      - run: npm run validate:interface
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: interface-renderer
          path: artifacts/interface-renderer/
