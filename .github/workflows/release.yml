name: Release native packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            rust_targets: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            platform: linux
            arch: aarch64
            rust_targets: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - label: Windows x64
            os: windows-2022
            platform: windows
            arch: x86_64
            vc_arch: x64
            rust_targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - label: Windows ARM64
            os: windows-11-arm
            platform: windows
            arch: aarch64
            vc_arch: arm64
            rust_targets: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
          - label: macOS universal
            os: macos-15
            platform: macos
            arch: universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_targets }}
      - name: Install Linux packaging and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb
      - name: Prepare pinned liblsl runtime
        run: python scripts/prepare_lsl.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Bundle the Microsoft C++ runtime used by liblsl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          $redist = Get-ChildItem "$installation\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $crt = Join-Path $redist.FullName "${{ matrix.vc_arch }}\Microsoft.VC143.CRT"
          if (-not (Test-Path $crt)) { throw "Microsoft VC runtime not found at $crt" }
          Copy-Item "$crt\*.dll" apps/polar-stream/resources/
      - name: Verify bundled liblsl can create an outlet
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux) library=apps/polar-stream/resources/liblsl.so ;;
            windows) library=apps/polar-stream/resources/lsl.dll ;;
            macos) library=apps/polar-stream/resources/liblsl.dylib ;;
          esac
          cargo run -p polar-h10-output --example verify_lsl --locked -- "$library"
      - name: Build installers into a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/polar-stream
          tagName: ${{ github.ref_name }}
          releaseName: Polar Stream ${{ github.ref_name }}
          releaseBody: |
            Native Polar Stream packages for Windows, macOS, and Linux.

            Choose the installer matching your operating system and CPU. The download guide is linked from the repository home page.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          releaseAssetNamePattern: Polar-Stream_[version]_[platform]_[arch][_setup].[ext]
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Smoke-test Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 12s xvfb-run -a "target/${{ matrix.target }}/release/polar-stream" > smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then cat smoke.log; exit 1; fi
      - name: Smoke-test macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/bundle/macos/Polar Stream.app/Contents/MacOS/polar-stream" > smoke.log 2>&1 &
          pid=$!
          sleep 8
          kill -0 "$pid" || { cat smoke.log; exit 1; }
          kill "$pid"
          wait "$pid" || true
      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process "target\${{ matrix.target }}\release\polar-stream.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Polar Stream exited during its launch smoke test with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id

  publish:
    name: Verify package set and publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify every supported package exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.assets' > release-assets.json
          python scripts/verify_release_assets.py release-assets.json
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
