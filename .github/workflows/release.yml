name: Release native packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            rust_targets: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            platform: linux
            arch: aarch64
            rust_targets: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - label: Windows x64
            os: windows-2022
            platform: windows
            arch: x86_64
            vc_arch: x64
            rust_targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - label: Windows ARM64
            os: windows-11-arm
            platform: windows
            arch: aarch64
            vc_arch: arm64
            rust_targets: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
          - label: macOS universal
            os: macos-15
            platform: macos
            arch: universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-08-13
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_targets }}
      - name: Install locked frontend tooling
        run: npm ci
      - name: Install Linux packaging and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb qt6-base-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0
      - name: Install CMake for the ARM64 LabRecorder source build
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        run: python -m pip install --disable-pip-version-check cmake==3.31.8
      - name: Install Qt for the Windows ARM64 LabRecorder source build
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0 cmake==3.31.8
          $qtInstall = Join-Path $env:RUNNER_TEMP "lab-recorder-qt"
          python -m aqt install-qt windows_arm64 desktop 6.8.3 win64_msvc2022_arm64 --autodesktop --outputdir $qtInstall
          $qtRoot = Join-Path $qtInstall "6.8.3/msvc2022_arm64"
          if (-not (Test-Path -LiteralPath (Join-Path $qtRoot "lib/cmake/Qt6/Qt6Config.cmake") -PathType Leaf)) {
            throw "Qt 6.8.3 ARM64 was not installed at $qtRoot"
          }
          "POLAR_STREAM_QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare pinned liblsl runtime
        run: python scripts/prepare_lsl.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Prepare pinned bundled LabRecorder
        run: python scripts/prepare_lab_recorder.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Bundle the Microsoft C++ runtime used by liblsl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          $runtime = Get-ChildItem "$installation\VC\Redist\MSVC" -Recurse -File -Filter vcruntime140.dll |
            Where-Object {
              $_.Directory.Parent.Name -eq "${{ matrix.vc_arch }}" -and
              $_.Directory.Name -like "Microsoft.VC*.CRT"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $runtime) { throw "Microsoft VC runtime not found for ${{ matrix.vc_arch }}" }
          Copy-Item "$($runtime.Directory.FullName)\*.dll" apps/polar-stream/resources/
      - name: Normalize and ad-hoc sign the standalone macOS liblsl
        if: runner.os == 'macOS'
        shell: bash
        run: |
          install_name_tool -id @rpath/liblsl.dylib apps/polar-stream/resources/liblsl.dylib
          codesign --force --sign - apps/polar-stream/resources/liblsl.dylib
          otool -L apps/polar-stream/resources/liblsl.dylib
      - name: Verify bundled liblsl can create independent mixed-device outlets
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux) library=apps/polar-stream/resources/liblsl.so ;;
            windows) library=apps/polar-stream/resources/lsl.dll ;;
            macos) library=apps/polar-stream/resources/liblsl.dylib ;;
          esac
          cargo run -p polar-h10-output --example verify_lsl --locked -- "$library"
          cargo run -p polar-h10-output --example verify_mixed_lsl --locked -- "$library"
      - name: Build installers with the repository-pinned Tauri CLI
        working-directory: apps/polar-stream
        run: npx --no-install tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Stage deterministic release assets
        run: >-
          python scripts/stage_release_assets.py
          --bundle-root target/${{ matrix.target }}/release/bundle
          --output release-assets
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --version ${{ github.ref_name }}
      - name: Smoke-test exact Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=$(find release-assets -iname '*.AppImage' -print -quit)
          deb=$(find release-assets -iname '*.deb' -print -quit)
          test -n "$appimage" && test -n "$deb"
          appimage=$(realpath "$appimage")
          deb=$(realpath "$deb")
          chmod +x "$appimage"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 12s xvfb-run -a "$appimage" > appimage-smoke.log 2>&1
          appimage_status=$?
          set -e
          if [ "$appimage_status" -ne 124 ]; then cat appimage-smoke.log; exit 1; fi
          appimage_extract=$(mktemp -d)
          deb_root=$(mktemp -d)
          cleanup() {
            rm -rf "$appimage_extract" "$deb_root"
          }
          trap cleanup EXIT
          (
            cd "$appimage_extract"
            "$appimage" --appimage-extract >/dev/null
          )
          appimage_recorder=$(find "$appimage_extract/squashfs-root" -type f -path '*/lab-recorder/LabRecorder' -print -quit)
          test -n "$appimage_recorder"
          appimage_recorder_root=$(dirname "$appimage_recorder")
          set +e
          env LD_LIBRARY_PATH="$appimage_recorder_root/lib" QT_PLUGIN_PATH="$appimage_recorder_root/plugins" QT_QPA_PLATFORM_PLUGIN_PATH="$appimage_recorder_root/plugins/platforms" timeout 12s xvfb-run -a "$appimage_recorder" -c "$appimage_recorder_root/PolarStream-LabRecorder.cfg" > appimage-recorder-smoke.log 2>&1
          appimage_recorder_status=$?
          set -e
          if [ "$appimage_recorder_status" -ne 124 ]; then cat appimage-recorder-smoke.log; exit 1; fi
          dpkg-deb --info "$deb" >/dev/null
          dpkg-deb --extract "$deb" "$deb_root"
          deb_binary=$(find "$deb_root" -type f -path '*/bin/polar-stream' -print -quit)
          test -n "$deb_binary"
          set +e
          timeout 12s xvfb-run -a "$deb_binary" > deb-smoke.log 2>&1
          deb_status=$?
          set -e
          if [ "$deb_status" -ne 124 ]; then cat deb-smoke.log; exit 1; fi
          deb_recorder=$(find "$deb_root" -type f -path '*/lab-recorder/LabRecorder' -print -quit)
          test -n "$deb_recorder"
          deb_recorder_root=$(dirname "$deb_recorder")
          set +e
          env LD_LIBRARY_PATH="$deb_recorder_root/lib" QT_PLUGIN_PATH="$deb_recorder_root/plugins" QT_QPA_PLATFORM_PLUGIN_PATH="$deb_recorder_root/plugins/platforms" timeout 12s xvfb-run -a "$deb_recorder" -c "$deb_recorder_root/PolarStream-LabRecorder.cfg" > deb-recorder-smoke.log 2>&1
          deb_recorder_status=$?
          set -e
          if [ "$deb_recorder_status" -ne 124 ]; then cat deb-recorder-smoke.log; exit 1; fi
      - name: Smoke-test exact macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find release-assets -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_point=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_point" -quiet || true
            rmdir "$mount_point" || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -quiet
          "$mount_point/Polar Stream.app/Contents/MacOS/polar-stream" > smoke.log 2>&1 &
          pid=$!
          sleep 8
          kill -0 "$pid" || { cat smoke.log; exit 1; }
          recorder_app=$(find "$mount_point" -type d -path '*/Resources/lab-recorder/LabRecorder.app' -print -quit)
          test -n "$recorder_app"
          codesign --verify --deep --strict "$recorder_app"
          recorder_root=$(dirname "$recorder_app")
          "$recorder_app/Contents/MacOS/LabRecorder" -c "$recorder_root/PolarStream-LabRecorder.cfg" > recorder-smoke.log 2>&1 &
          recorder_pid=$!
          sleep 6
          kill -0 "$recorder_pid" || { cat recorder-smoke.log; exit 1; }
          kill "$recorder_pid"
          wait "$recorder_pid" || true
          kill "$pid"
          wait "$pid" || true
      - name: Smoke-test exact Windows MSI payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem release-assets -Filter *.msi -File -ErrorAction Stop).FullName
          $nsis = (Get-ChildItem release-assets -Filter *.exe -File -ErrorAction Stop).FullName
          $extract = Join-Path $env:RUNNER_TEMP "polar-stream-msi"
          $installer = Start-Process msiexec.exe -ArgumentList @("/a", "`"$msi`"", "/qn", "TARGETDIR=`"$extract`"") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "MSI administrative extraction failed with code $($installer.ExitCode)" }
          $executable = Get-ChildItem $extract -Recurse -File -Filter polar-stream.exe | Select-Object -First 1
          if (-not $executable) { throw "The MSI did not contain polar-stream.exe" }
          $process = Start-Process $executable.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Packaged Polar Stream exited with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          $recorder = Get-ChildItem $extract -Recurse -File -Filter LabRecorder.exe | Select-Object -First 1
          if (-not $recorder) { throw "The MSI did not contain the bundled LabRecorder.exe" }
          $recorderConfig = Join-Path $recorder.Directory.FullName "PolarStream-LabRecorder.cfg"
          if (-not (Test-Path -LiteralPath $recorderConfig -PathType Leaf)) { throw "The MSI did not contain the safe LabRecorder config" }
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $recorder.FullName
          $startInfo.ArgumentList.Add("-c")
          $startInfo.ArgumentList.Add($recorderConfig)
          $recorderProcess = [Diagnostics.Process]::Start($startInfo)
          Start-Sleep -Seconds 6
          if ($recorderProcess.HasExited) { throw "Bundled LabRecorder exited with code $($recorderProcess.ExitCode)" }
          Stop-Process -Id $recorderProcess.Id
          $header = [IO.File]::ReadAllBytes($nsis)[0..1]
          if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) { throw "The NSIS package is not a Windows executable" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Verify package set and publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify every supported package exists
        run: python scripts/verify_release_assets.py release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum Polar-Stream_* > SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release-assets/* --clobber
          else
            gh release create "${{ github.ref_name }}" release-assets/* \
              --draft \
              --title "Polar Stream ${{ github.ref_name }}" \
              --notes "Native Polar Stream packages for Windows, macOS, and Linux. Choose the installer matching your operating system and CPU. These packages are unsigned until platform signing credentials are configured."
          fi
      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets' > release-assets.json
          python scripts/verify_release_assets.py release-assets.json
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
