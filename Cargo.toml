[workspace]
members = [
    "apps/polar-stream",
    "crates/polar-h10-core",
    "crates/polar-h10-input",
    "crates/polar-h10-metrics",
    "crates/polar-h10-output",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/GeorgeFejer91/Polar-Stream"

[workspace.dependencies]
futures-util = "0.3"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = "1"
