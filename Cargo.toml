[workspace]
members = [
    "apps/polar-stream",
    "crates/polar-h10-core",
    "crates/polar-h10-input",
    "crates/polar-h10-metrics",
    "crates/polar-h10-output",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/GeorgeFejer91/Polar-Stream"

[workspace.dependencies]
futures-util = "0.3"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = "1"

[profile.release]
# Thin LTO retains cross-crate optimization with materially lower link cost
# than fat LTO. One codegen unit and symbol stripping favor a compact package.
lto = "thin"
codegen-units = 1
strip = "symbols"
